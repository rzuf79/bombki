name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW w64 32-bit (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Configure (native)
        if: ${{ runner.os != 'Windows' }}
        run: cmake -S c-port -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Configure (MinGW 32-bit)
        if: ${{ runner.os == 'Windows' }}
        shell: msys2 {0}
        run: cmake -S c-port -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build (native)
        if: ${{ runner.os != 'Windows' }}
        run: cmake --build build

      - name: Build (MinGW 32-bit)
        if: ${{ runner.os == 'Windows' }}
        shell: msys2 {0}
        run: cmake --build build

      - name: Run tests (native)
        if: ${{ runner.os != 'Windows' }}
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (MinGW 32-bit)
        if: ${{ runner.os == 'Windows' }}
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Verify 32-bit binary (Windows)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        shell: msys2 {0}
        run: |
          set -e
          exe=$(find build -name bombki.exe | head -n1)
          test -n "$exe"
          objdump -f "$exe" | grep -q "architecture: i386" \
            || { echo "expected a 32-bit binary, got:"; objdump -f "$exe" | grep architecture; exit 1; }

      - name: Ship required MinGW runtime DLLs next to executables (Windows)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        shell: msys2 {0}
        run: |
          set -e
          for exe in $(find build -name '*.exe'); do
            dir=$(dirname "$exe")
            objdump -p "$exe" | sed -n 's/.*DLL Name: \(.*\)/\1/p' | while read -r dll; do
              if [ -f "$MINGW_PREFIX/bin/$dll" ]; then
                cp "$MINGW_PREFIX/bin/$dll" "$dir/"
              fi
            done
          done

      - name: Upload executables
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: |
            build/**/bombki
            build/**/bombki.exe
            build/**/*.dll
          if-no-files-found: ignore