name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S c-port -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Debug

      - name: Upload executables
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: |
            build/**/bombki
            build/**/bombki.exe
          if-no-files-found: ignore
