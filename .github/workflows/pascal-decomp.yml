name: pascal-decomp

on:
  push:
    branches: [main, 'recon/**']
  pull_request:
  workflow_dispatch:

jobs:
  fpc-conformance:
    name: FPC TP-mode conformance sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run conformance sweep in FPC image
        run: |
          docker run --rm \
            -e CONF_ARTIFACTS=/src/pascal-decomp/conformance/artifacts \
            -v "${{ github.workspace }}":/src -w /src \
            freepascal/fpc:3.2.2-full \
            sh pascal-decomp/conformance/pas-conformance.sh

      - name: Upload sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: pas-sweep
          path: pascal-decomp/conformance/artifacts/
          if-no-files-found: warn

  tp7-conformance:
    name: TP7 conformance sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use published TP7 image or build locally
        id: image
        run: |
          if docker pull ghcr.io/rzuf79/bombki-dosbox-tp7:latest; then
            echo "image=ghcr.io/rzuf79/bombki-dosbox-tp7:latest" >> "$GITHUB_OUTPUT"
          else
            echo "Published image unavailable; building pascal-decomp/docker/dosbox-tp7 locally"
            docker build -t bombki-tp7 pascal-decomp/docker/dosbox-tp7
            echo "image=bombki-tp7" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TP7 conformance sweep in DOSBox image
        run: |
          timeout 300s docker run --rm \
            -e CONF_ARTIFACTS=/workspace/pascal-decomp/conformance/artifacts \
            -v "${{ github.workspace }}":/workspace \
            --entrypoint sh \
            ${{ steps.image.outputs.image }} \
            -c 'sh /workspace/pascal-decomp/conformance/tp7-conformance.sh'

      - name: Compare reconstructed TPUs byte-for-byte
        run: |
          python3 pascal-decomp/conformance/compare_tpu.py \
            --original-dir og \
            --rebuilt-dir pascal-decomp/conformance/artifacts

      - name: Upload sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: tp7-sweep
          path: pascal-decomp/conformance/artifacts/
          if-no-files-found: warn
